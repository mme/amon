[tools]
# Ghostty's VT library builds with zig and pins this exact version; the
# libghostty-vt crate's build fails loudly on anything else.
zig = "0.15.2"
# The test runner. herdr's vendored tests mutate process-global environment
# variables (they remove HOME to exercise fallback paths), so they need a
# process per test rather than a thread per test. nextest does that; plain
# `cargo test` races and fails intermittently.
"cargo:cargo-nextest" = "0.9.140"
