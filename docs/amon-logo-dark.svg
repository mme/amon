<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 214.75 272.25" role="img" aria-label="amon">
  <!--
    amon logo, traced from the source raster and verified against it by
    rendering this file at 268x298 and diffing: every deviation is under one
    pixel of the original's edge.

    Coordinates are the original's pixel grid, shifted to the artwork's
    bounding box by the translate below. Symmetry axis is x=131.
  -->
  <g transform="translate(-22.75 -16)" fill="#ffffff">
    <!--
      Head: a superellipse |x/74.5|^4.4 + |y/66.5|^4.4 = 1 about (131,133) —
      NOT a rounded rectangle. A circular-corner rect deviates by 3-4px
      mid-arc. Eight cubics approximate it to 0.58px; the eyes are knocked
      out of the same path with fill-rule="evenodd".
    -->
    <path fill-rule="evenodd" d="M 205.5 133 C 205.5 163.75 205.56 180.06 194.64 189.81 C 182.77 200.41 159.67 199.5 131 199.5 C 102.33 199.5 79.23 200.41 67.36 189.81 C 56.44 180.06 56.5 163.75 56.5 133 C 56.5 102.25 56.44 85.94 67.36 76.19 C 79.23 65.59 102.33 66.5 131 66.5 C 159.67 66.5 182.77 65.59 194.64 76.19 C 205.56 85.94 205.5 102.25 205.5 133 Z M 96.5 122.75 A 8 8 0 0 1 112.5 122.75 L 112.5 143.25 A 8 8 0 0 1 96.5 143.25 Z M 149.5 122.75 A 8 8 0 0 1 165.5 122.75 L 165.5 143.25 A 8 8 0 0 1 149.5 143.25 Z"/>

    <!-- Ears: capsules that float clear of the head by 8px. Not attached. -->
    <path d="M 33.75 120.5 A 7.25 7.25 0 0 1 48.25 120.5 L 48.25 145.5 A 7.25 7.25 0 0 1 33.75 145.5 Z M 213.75 120.5 A 7.25 7.25 0 0 1 228.25 120.5 L 228.25 145.5 A 7.25 7.25 0 0 1 213.75 145.5 Z"/>

    <!-- Antenna: the stem stops 7px short of the head, same as the ears. -->
    <circle cx="131" cy="29" r="13"/>
    <path d="M 131 42 L 131 56" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>

    <!--
      Wordmark: geometric forms built from one 7px round-capped stroke.
      Baseline 284, x-height line 249. The round letters (a, o) overshoot
      both by ~1px, as type does.
    -->
    <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="44.5" cy="266.5" r="18.25"/>
      <path d="M 62.75 249 L 62.75 284"/>
      <path d="M 79 249 L 79 284"/>
      <path d="M 79 263.25 A 14.75 14.75 0 0 1 108.5 263.25 L 108.5 284"/>
      <path d="M 108.5 263.25 A 14.75 14.75 0 0 1 138 263.25 L 138 284"/>
      <circle cx="170" cy="266.5" r="18.25"/>
      <path d="M 203 249 L 203 284"/>
      <path d="M 203 264 A 15.5 15.5 0 0 1 234 264 L 234 284"/>
    </g>
  </g>
</svg>
