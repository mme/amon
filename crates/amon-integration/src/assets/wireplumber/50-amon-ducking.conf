# Ducks other audio while an amon notification plays.
#
# Installed by `amon setup` into ~/.config/wireplumber/wireplumber.conf.d/;
# `amon remove` deletes it. Removing this file and restarting WirePlumber
# restores the stock audio setup completely — nothing else is changed
# anywhere.
#
# How it works: WirePlumber's role-based linking policy (part of its standard
# policy, dormant until role sinks exist) routes streams into per-role
# loopback buses. This file declares two buses — Multimedia for everything,
# Notifications for amon's sounds, which the daemon tags with
# `media.role=Notification` — and the Notification bus's higher priority
# ducks the Multimedia bus to a quarter volume while a notification stream
# is live. WirePlumber restores the volume when the stream ends.
#
# Derived from WirePlumber 0.5's own media-role-nodes.conf example, trimmed
# to the two roles amon needs.

wireplumber.profiles = {
  main = {
    policy.linking.role-based.loopbacks = required
  }
}

wireplumber.settings = {
  # Streams that declare no role count as music, so everything routes
  # through the Multimedia bus and can be ducked.
  node.stream.default-media-role = "Multimedia"

  # How far the music drops while a notification plays. Found by ear.
  linking.role-based.duck-level = 0.25
}

wireplumber.components.rules = [
  {
    matches = [ { provides = "~loopback.sink.*" } ]
    actions = {
      merge = {
        arguments = {
          capture.props = {
            policy.role-based.target = true
            audio.position = [ FL, FR ]
            media.class = Audio/Sink
          }
          playback.props = {
            # Lets the real sink suspend when nothing is playing.
            node.passive = true
            # An unused role, so the buses can never chain onto each other.
            media.role = "Loopback"
          }
        }
        requires = [ support.export-core, pw.node-factory.adapter ]
      }
    }
  }
]

wireplumber.components = [
  {
    type = virtual, provides = policy.linking.role-based.loopbacks
    requires = [ loopback.sink.role.multimedia
                 loopback.sink.role.notification ]
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.name = "loopback.sink.role.multimedia"
      node.description = "Multimedia"
      capture.props = {
        device.intended-roles = [ "Music", "Movie", "Game", "Multimedia" ]
        policy.role-based.priority = 10
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "mix"
      }
    }
    provides = loopback.sink.role.multimedia
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.name = "loopback.sink.role.notification"
      node.description = "Notifications"
      capture.props = {
        device.intended-roles = [ "Notification" ]
        policy.role-based.priority = 20
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "duck"
      }
    }
    provides = loopback.sink.role.notification
  }
]
