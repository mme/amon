[package]
name = "amon-detect"
description = "Agent state detection engine and manifests, vendored from herdr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Only for the channel type in the vendored updater's `auto_update` signature;
# amon itself calls the synchronous path. No runtime is pulled in.
tokio = { version = "1", default-features = false, features = ["sync"] }
toml = { workspace = true }
tracing = "0.1"

[dev-dependencies]
# The vendored detection tests spawn real PTYs and poke at process groups.
libc = { workspace = true }
portable-pty = { workspace = true }
